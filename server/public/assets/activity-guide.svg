<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">짧게 시작하고 활동을 쌓아가는 하루</title><desc id="desc">출근길 5분, 점심 뒤 5분, 저녁 5분 걷기는 시작을 위한 생활 예시이며 권장 활동량 충족을 뜻하지 않습니다.</desc>
<rect width="1200" height="560" rx="24" fill="#f0f3ec"/>
<g font-family="Malgun Gothic,Segoe UI,sans-serif" fill="#183b32">
<text x="64" y="63" font-size="19" font-weight="700" letter-spacing="2">AON · 건강뉴스</text>
<text x="64" y="119" font-size="37" font-weight="700">짧게 시작하고, 하루에 나눠 보세요</text>
<text x="64" y="160" font-size="21" fill="#52685e">아래 시간은 생활 속 시작 예시입니다. 자신에게 맞게 조절해 보세요.</text>
<path d="M230 261 H970" stroke="#c5d4c7" stroke-width="3"/>
<rect x="64" y="208" width="330" height="230" rx="18" fill="#fff"/>
<rect x="435" y="208" width="330" height="230" rx="18" fill="#fff"/>
<rect x="806" y="208" width="330" height="230" rx="18" fill="#fff"/>
<g stroke="#557969" stroke-width="3" fill="none" stroke-linecap="round">
<circle cx="112" cy="258" r="14"/><path d="M112 231v-6 M112 285v6 M85 258h-6 M139 258h6 M93 239l-4-4 M131 277l4 4 M93 277l-4 4 M131 239l4-4"/>
<circle cx="482" cy="258" r="20"/><path d="M482 246v13l10 6"/>
<path d="M864 239a22 22 0 1 0 16 35 24 24 0 0 1-16-35Z"/>
</g>
<text x="92" y="321" font-size="26" font-weight="700">출근길</text><text x="92" y="359" font-size="20" fill="#52685e">조금 일찍 내려 걷기</text><text x="92" y="406" font-size="29" font-weight="700">5분</text>
<text x="463" y="321" font-size="26" font-weight="700">점심 뒤</text><text x="463" y="359" font-size="20" fill="#52685e">가까운 곳을 한 바퀴</text><text x="463" y="406" font-size="29" font-weight="700">5분</text>
<text x="834" y="321" font-size="26" font-weight="700">저녁</text><text x="834" y="359" font-size="20" fill="#52685e">집 주변에서 산책하기</text><text x="834" y="406" font-size="29" font-weight="700">5분</text>
<text x="64" y="491" font-size="21" font-weight="700">5분씩 세 번은 시작의 예시이며, 이 양으로 충분하다는 뜻은 아닙니다.</text>
<text x="64" y="527" font-size="19" fill="#52685e">활동의 시간뿐 아니라 강도와 일주일 전체의 양도 함께 살펴봅니다.</text>
</g></svg>
